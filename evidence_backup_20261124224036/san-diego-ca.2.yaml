  solar_storage:
    permit_required:
      value: yes
      quote: "An Electrical Permit is required for the installation of photovoltaic (PV), Batteries / ESS (Energy Storage System), PV deferred from another building permit,"
      url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/301
    plans_required_single_family:
      value: yes
      program_name: "Residential Rooftop-Mounted Solar Photovoltaic (PV) Permit"
      quote: "All applicants are required to upload Building Construction Plans and specifications. NOTE: The documents must be in PDF format."
      url: https://www.sandiego.gov/development-services/permits/solar-photovoltaic-permit
    checklist_published: true
    checklist:
      title: "Information Bulletin 301 - How to Obtain a Permit for the Installation of Solar Photovoltaic (PV) Systems"
      revision_date: "unknown"
      url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/301
    requirements:
      - item: "Building Construction Plans incorporating all elements of the Residential Solar PV Project Plan Template"
        section: site_plan
        quote: "Review the Residential Solar PV Project Plan Template and incorporate all elements outlined within the template into your design. All applicants are required to upload Building Construction Plans and specifications."
        url: https://www.sandiego.gov/development-services/permits/solar-photovoltaic-permit
        page: null
      - item: "Single-Line Diagram showing complete rating information of the existing electrical system"
        section: one_line
        quote: "Show the existing electrical system's complete rating information for the purpose of determining adequate interconnection of the PV system."
        url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/301
        page: null
      - item: "Manufacturer's specifications for PV modules, racking, inverters, batteries/ESS, and meter"
        section: equipment
        quote: "Provide the manufacturer's specifications for the proposed PV modules, racking, inverter(s), batteries/ESS, and meter."
        url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/301
        page: null
      - item: "Plans stamped and signed by CA Civil/Electrical Engineer or C-10, B, or C-46 contractor"
        section: other
        quote: "PV or batteries/ESS plans may be stamped and signed by a California registered Civil or Electrical Engineer or a licensed Electrical Contractor (C-10 License), General Contractor (B License) or Solar Contractor (C-46 License) who is responsible for the design and installation of the system."
        url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/301
        page: null
    load_calculation:
      method: not_stated
      city_worksheet: "none"
      ev_charger_load_factor: not_stated
      quote: "unknown"
      url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/301
    sheet_requirements:
      sheet_size: "11x17 minimum, 36x48 maximum"
      copies_or_format: "PDF format upload"
      signature_or_stamp: "CA Civil/Electrical Engineer or C-10, B, or C-46 contractor; CA Electrical Engineer or C-10 required if panel upgrade is proposed"
      quote: "When an electrical panel upgrade is proposed, a California-registered Electrical Engineer or a C-10 must sign and stamp the plans."
      url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/301
    local_rules:
      - rule: "Residential rooftop PV permit may include panel upgrade up to 320 amps, ESS up to 38.4 kWh (20 kWh max per unit), and inverter-integrated EV charger"
        quote: "Along with the PV installation, the following work may be included: A panel upgrade of up to 320 amps. An energy storage system of up to 38.4 kWh, with each unit not exceeding 20 kWh. An Inverter-integrated electric vehicle (EV) charger."
        url: https://www.sandiego.gov/development-services/permits/solar-photovoltaic-permit
      - rule: "System is not approved to energize until SDG&E approval is obtained after City final inspection"
        quote: "After receiving final inspection approval for all related City of San Diego Approvals (permits), San Diego Gas and Electric (SDG&E) will be notified. The system is not approved to energize until SDG&E approval is obtained."
        url: https://www.sandiego.gov/sites/default/files/solar_pv.pdf
    searched:
      - "site:sandiego.gov \"Information Bulletin 301\" OR \"IB-301\" solar PV"
      - "site:sandiego.gov \"SolarAPP+\" OR \"SolarAPP\" permit"
      - "site:sandiego.gov \"Energy Storage\" OR \"battery storage\" residential permit"
open_questions:
  - "Information Bulletin 103 (https://www.sandiego.gov/development-services/forms-publications/information-bulletins/103) lists 'Generator Only' in its fee table, but the full table row indicating whether it qualifies for Simple Permits - MEP or requires plans was not readable in search snippets; verify directly on IB-103."
  - "No dedicated City of San Diego Information Bulletin or submittal checklist for residential standby/portable generators with interlocks or transfer switches was found on sandiego.gov; confirm with DSD whether plans are always required."
  - "Verify whether City of San Diego accepts SolarAPP+ for residential rooftop solar PV and battery storage; no official sandiego.gov page for SolarAPP+ was returned in search results."
  - "Information Bulletin 301 (https://www.sandiego.gov/development-services/forms-publications/information-bulletins/301) exact printed revision date should be confirmed directly on the HTML page."