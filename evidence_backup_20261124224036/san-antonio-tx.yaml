        section: application
        quote: "Property Owner Name: Registration Holder Name: Registration Holder #: Delegate Name (if applicable): Contractor / Company Name: Contractor / Company State License #:"
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/DSD_Electrical_Application.pdf
        page: 1
      - item: "Itemized quantities of electrical equipment/circuits to be installed, repaired, or modified for fee calculation"
        section: equipment
        quote: "Enter the quantity of items that will be installed, repaired, or modified in an way in the associated permit area(s) below."
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/DSD_Electrical_Application.pdf
        page: 2
      - item: "Indication of whether work with CPS Energy is required"
        section: utility
        quote: "Work With CPS required? YES. NO."
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/DSD_Electrical_Application.pdf
        page: 1
