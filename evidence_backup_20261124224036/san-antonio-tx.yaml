agency: City of San Antonio Development Services Department (DSD)
portal_url: https://aca-prod.accela.com/COSA/default.aspx
code_edition:
  value: "2023 National Electrical Code (as adopted and amended by City of San Antonio Chapter 10)"
  effective_date: unknown
  quote: "2023 National Electrical Code"
  url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB170.pdf
who_may_file:
  owner_may_file: false
  conditions: "Electrical permits can only be obtained by licensed electrical contractors registered with the City (homeowners may only pull plumbing permits for an existing homestead)"
  quote: "Separate permits are required for trade work and can only be obtained by licensed contractors (mechanical, electrical, plumbing)."
  url: https://www.sa.gov/Directory/Departments/DSD/Resources/Getting-Started
utility:
  name: CPS Energy
  requirements:
    - item: "Submit new or modified electric service requests through the CPS Energy Customer Engineering Web Portal"
      quote: "CPS Energy has a Customer Engineering Web Portal to request new electric or gas services, security lights or to change an existing service."
      url: https://www.sa.gov/Directory/Departments/DSD/Resources/Getting-Started
    - item: "Exterior service disconnect required by CPS Energy for one- and two-family dwellings"
      quote: "(Note: CPS Energy requires exterior service disconnect for dwellings)."
      url: https://docsonline.sanantonio.gov/DSDUploads/20221109DSD_GSABA_ElectricalCode.pdf
    - item: "Submit online registration, One-Line Diagram, Site Layout/Plan, Photos, Equipment Specs, and DER Application to cpsesolar@cpsenergy.com for solar PV"
      quote: "Step 2: Submit online registration form & preconstruction documentation: One-Line Diagram, Site Layout/Plan and Photos, Equipment Specifications, and the Distributed Energy Resource (DER) Application to cpsesolar@cpsenergy.com."
      url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
    - item: "City DSD inspection approval must be passed and sent to CPS Energy for utility release"
      quote: "If appropriate inspections are passed, the approval is manually sent to CPS Energy for the release."
      url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB104a.pdf
jobs:
  ev_charger:
    permit_required:
      value: yes
      quote: "Any owner or authorized agent who intends to construct, enlarge, alter, repair, move, demolish, or change the occupancy of a building or structure, to include a sign or billboard, or to erect, install, enlarge, alter, repair, remove, convert or replace any electrical, gas, mechanical or plumbing."
      url: https://docsonline.sanantonio.gov/DSDUploads/2024Ch10Building-RelatedCodesFinal.pdf
    plans_required_single_family:
      value: no
      program_name: "BuildSA Online Electrical Permit (General Electrical Permit)"
      quote: "Professional Engineer sealed electrical drawings and plan review ($100) will be required if answering yes to any of the following questions below: Y N. Is any equipment over 600 amps @ 250 volts or less or over 400amps @ 250 volts or greater?"
      url: https://docsonline.sanantonio.gov/FileUploads/dsd/DSD_Electrical_Application.pdf
    checklist_published: false
    checklist:
      title: "none"
      revision_date: "unknown"
      url: unknown
    requirements:
