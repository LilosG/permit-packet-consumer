      quote: "Ensure all documentation is available in electronic format to upload to Citizen Access."
      url: https://docsonline.sanantonio.gov/FileUploads/DSD/BuildSAElectronicDocumentReviewFAQs.pdf
    local_rules:
      - rule: "Every permit expires within 180 days if no proof of work or progress is shown"
        quote: "Every permit application and permit will expire within 180 days if no proof of work or progress has been shown."
        url: https://www.sa.gov/Directory/Departments/DSD/Constructing/Business-Commercial/Permit-Process
      - rule: "Applicant is responsible for verifying any applicable CC&Rs (see Information Bulletin 234)"
        quote: "It is imperative and incumbent upon you the applicant to verify the existence of any CC&Rs that may be applicable to your project. See Information Bulletin 234 for additional information."
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/DSD_Electrical_Application.pdf
