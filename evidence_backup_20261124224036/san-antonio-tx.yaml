    sheet_requirements:
      sheet_size: "not_stated"
      copies_or_format: "Electronic upload via BuildSA Customer Portal"
      signature_or_stamp: "Texas-licensed PE stamp required for structural calculations when roof slope <4:12 with >6 lbs/sq ft, >=2 roof coverings, or new structure"
      quote: "Any revised file or sheet should contain all the information supplied in the original plus indications of corrections made."
      url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
    local_rules:
      - rule: "Master Electrician must be the primary applicant on the DSD Photovoltaic permit application"
        quote: "The master electrician must be the applicant."
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
      - rule: "Rough-in and final solar inspections are typically requested at the same time via BuildSA"
        quote: "Typically, the rough-in and final are called at the same time."
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
      - rule: "Systems >=25 kW AC are forwarded to CPS Energy DER Engineering Team for additional review"
        quote: "(Note: =>25kW AC systems will be forwarded to DER Engineering Team for review)."
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
