  solar_storage:
    permit_required:
      value: yes
      quote: "Apply on-line by filling out the electronic application, which includes the address, contact information, and questions related to the solar – PV work."
      url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
    plans_required_single_family:
      value: yes
      program_name: "DSD Photovoltaic Permit Application (BuildSA Building Module; technical plan review goal 3 working days)"
      quote: "Once files are uploaded, the City of San Antonio receives notice of the application and checks for completeness of the application and documents prior to the start of technical plan review."
      url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
    checklist_published: true
    checklist:
      title: "Information Bulletin 153: Requirements for Solar Photovoltaic Systems (PV) (Commercial/Residential)"
      revision_date: "May 2025"
      url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
    requirements:
      - item: "Online DSD Photovoltaic permit application submitted by a Master Electrician via BuildSA building module"
        section: application
        quote: "The master electrician must be the applicant. Others may be added as contacts to the application record. The application is located under the building module tab in the customer portal."
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
        page: 3
      - item: "Site Plan showing existing/proposed structures, setbacks to property/lot lines, and main electrical service wall layout"
        section: site_plan
        quote: "1) Site Plan – showing the location of: a) Existing structures on the property. i) Location of any newly proposed structures. ii) Provide set back locations and dimensions to property lines and internal lot lines. b) Main Electrical Service."
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
        page: 3
      - item: "Texas-licensed PE structural calculations if roof array >6 lbs/sq ft on <4:12 pitch, >=2 roof coverings, or new support structure"
        section: other
        quote: "Single Family, R-3, duplex, and townhome buildings shall require Engineering calculations from an engineer licensed in the State of Texas for roof-mounted array systems where any of the following occur:"
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
        page: 4
      - item: "CPS Energy preconstruction package: One-Line Diagram, Site Layout/Plan, Photos, Equipment Specs, and DER Application"
        section: utility
        quote: "Step 2: Submit online registration form & preconstruction documentation: One-Line Diagram, Site Layout/Plan and Photos, Equipment Specifications, and the Distributed Energy Resource (DER) Application to cpsesolar@cpsenergy.com."
        url: https://docsonline.sanantonio.gov/FileUploads/dsd/IB153.pdf
        page: 1
    load_calculation:
