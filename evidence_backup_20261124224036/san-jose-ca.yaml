open_questions:
  - "City of San Jose lists Bulletin #351 (Single-Family & Duplex Projects Submittal Checklist), Bulletin #352 (Single-Family & Duplex Projects - Plan Set Instructions), and Bulletin #240 (Plans That Require an Architect or Engineer) on https://www.sanjoseca.gov/your-government/departments-offices/planning-building-code-enforcement/building-division/bulletins-forms, but full document contents/dates were not returned in search snippets; verify exact submittal items and sheet dimensions in those bulletins."
  - "Specific subpanel/feeder, sauna, and hot tub/spa 240 V circuit load calculation methods and standalone electrical checklists were not returned in search snippets; verify against https://www.sanjoseca.gov/businesses/development-services-permit-center/start-your-project/electrical-projects and https://www.sanjoseca.gov/businesses/development-services-permit-center/start-your-project/single-family-duplex-properties/swimming-pools-spas-hot-tubs."
  - "Standby generator page (https://www.sanjoseca.gov/?NavID=8957) shows electrical plan requirements for residential standby generators while the Single-Family & Duplex overview page (https://www.sanjoseca.gov/businesses/development-services-permit-center/start-your-project/single-family-duplex-properties) mentions Permit Center issuance for qualifying simple projects; confirm exact plan-check vs. counter/online eligibility for standby generators and portable generator transfer switches/interlocks."