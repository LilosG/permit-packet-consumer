portal_url: https://www.cityofhenderson.com/government/departments/building-and-fire-safety/building-online-services
code_edition:
  value: "2023 National Electrical Code (NEC) with Southern Nevada Amendments"
  effective_date: 2026-01-02
  quote: "2024 Codes (Effective on submittals received on or after January 2, 2026)"
  url: https://www.cityofhenderson.com/government/departments/building-and-fire-safety/standard-designs/electrical-information
who_may_file:
  owner_may_file: true
  conditions: "Owner building or improving a residential structure on their primary Nevada residence for their own occupancy (not intended for sale or lease) must submit the Nevada State Contractors Board Owner Builder Affidavit of Exemption per NRS 624.031 and sign each page of homeowner-drawn plans."
  quote: "A legal document from the Nevada State Contractors Board that is required per NRS 624.031 for an owner of a property who is building or improving a residential structure on the property for his own occupancy and not intended for sale or lease."
  url: https://www.cityofhenderson.com/government/departments/development-services-center/dsc-help/reference-forms-explained
utility:
  name: "NV Energy"
  requirements:
    - item: "Installations must comply with the 2026 NV Energy Electric Service Requirements (ESR) Book (Southern Nevada)"
      quote: "The Information and instructions contained in the Electric Service Requirements (ESR) Book represents the manner in which the distribution system is to be constructed in order to provide safe, reliable and cost effective electrical service to our customers."
      url: https://www.nvenergy.com/publish/content/dam/nvenergy/brochures_arch/account-services/building-and-new-construction/electric-service-standards-south/ESR-MASTER-EDITION.pdf
    - item: "Local Building Inspector approval required prior to NV Energy connecting service or setting meter"
      quote: "Customer installations must be approved by the local 'Building Inspector' in all areas, prior to the connection of service or setting of meter."
      url: https://www.nvenergy.com/publish/content/dam/nvenergy/brochures_arch/account-services/building-and-new-construction/electric-service-standards-north/section-7/OS0001U.pdf
    - item: "Submit solar PV and energy storage interconnection applications online via NV Energy PowerClerk with application fee"
      quote: "Applications are submitted through the online application portal, PowerClerk. Applications will be considered incomplete until the application fee has been paid."
      url: https://www.nvenergy.com/publish/content/dam/nvenergy/brochures_arch/cleanenergy/handbooks/SolarGenerations-Handbook.pdf
    - item: "Solar/ESS interconnections must be permitted locally and performed by a Nevada licensed C-2 or C-2g electrical contractor"
      quote: "Installations must be permitted through the local building authority and interconnections must be performed by a Nevada licensed C-2 or C-2g electrical contractor."
      url: https://www.nvenergy.com/publish/content/dam/nvenergy/brochures_arch/cleanenergy/handbooks/SolarGenerations-Handbook.pdf
