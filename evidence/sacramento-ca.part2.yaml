        page: 1
      - item: "Completed Electrical Load Calculation Worksheet CDD-0213"
        section: load
        quote: "Completed electrical load calculation worksheet. ( CDD-0213)"
        url: https://www.cityofsacramento.gov/content/dam/portal/cdd/Building/Forms/CDD-0282_Swimming-Pool-Plan-Review-Guidelines-Residential.pdf
        page: 1
      - item: "Scaled site plan showing equipment location and electrical features"
        section: site_plan
        quote: "Scaled site plan dimensioning the location of pool/pool equipment in relationship to the main dwelling, adjacent property line(s), and the landside toe of any flood control levee, along with any plumbing, electrical or landscape features as applicable."
        url: https://www.cityofsacramento.gov/content/dam/portal/cdd/Building/Forms/CDD-0282_Swimming-Pool-Plan-Review-Guidelines-Residential.pdf
        page: 1
