jurisdiction_key: oakland-ca
city: Oakland
state: CA
checked_on: 2026-11-25
code_edition:
  value: 2023 NEC (2025 California Electrical Code, Title 24 Part 3) with City of Oakland local amendments (OMC 15.04 and 15.06)
  effective_date: 2026-01-01
  quote: The Oakland amendments to the 2025 California Building Codes were approved by City Council on September 15,2025.
  url: https://www.oaklandca.gov/Planning-Building/Building-Construction-Permits-Inspections/Building-Codes/Oakland-Adoption-of-2025-California-Building-Codes
who_may_file:
  owner_may_file: true
  conditions: 'Property owners or their legal representatives may apply for residential electrical permits. To register an Online Permit Center account as an owner, the owner must provide a current California Driver''s License or ID Card, a copy of the recorded deed, and a completed Owner-Builder User Agreement. Exception: SolarAPP+ rooftop solar permits are restricted to California Licensed Contractors Only.'
  quote: 'If you are applying for a permit as the property Owner, you will need to provide the following:'
  url: https://www.oaklandca.gov/Planning-Building/Permit-Process-Overview/Permit-Services-Questions-Portal
jobs:
  ev_charger:
    permit_required:
      value: true
      quote: EV Charger installations are only subject to administrative review for health and safety requirements.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Electric-Vehicle-Service-Equipment-Charging-Stations
    plans_required_single_family:
      value: not_stated
      conditions: Structural calculations and engineered plans are required via a Building Worksheet if the project has anchoring work needing structural engineering design review; specific single-family Level 2 electrical plan thresholds are not stated on the webpage.
      quote: If your project has anchoring work needing structural engineering design review, you will also need a Building Permit.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Electric-Vehicle-Service-Equipment-Charging-Stations
    load_calculation:
      method: not_stated
      city_worksheet: none
      ev_charger_load_factor: not_stated
      quote: unknown
      url: unknown
    sheet_requirements:
      sheet_size: not_stated
      copies_or_format: PDF upload in Online Permit Center (compiled as one file, flattened layers, landscape orientation)
      signature_or_stamp: Electronic signature with Digital ID (no restriction settings)
      quote: Plan sets shall be compiled as one file. Plan sets that are not compiled will not be accepted.
      url: https://www.oaklandca.gov/Planning-Building/Permit-Process-Overview/Electronic-Plan-and-Document-Submittal-Guidelines
    requirements: []
  service_upgrade:
    permit_required:
      value: true
      quote: New, replacement, or relocated utility meters require Electrical or Plumbing Permits.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Utility-Meters
    plans_required_single_family:
      value: false
      conditions: Most MEP permits do not require plans and are issued automatically online upon payment. Zoning Review with a site plan is required if relocating a utility meter at or to a street-facing location.
      quote: Most MEP permits do not need plans. But if your project is complex, you can request an optional Plan Review (for an extra cost).
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Mechanical-Electrical-Plumbing-MEP-Permits
    load_calculation:
      method: not_stated
      city_worksheet: none
      ev_charger_load_factor: not_stated
      quote: unknown
      url: unknown
    sheet_requirements:
      same_as: ev_charger
    requirements:
    - item: PG&E AIC (Available Interrupting Current) letter for all electrical service releases (required at inspection)
      section: fault_current
      quote: AIC letter Required for all electrical service releases (new, like for like replacements, upgrades, disconnect/reconnect) by PG&E.
      url: https://www.oaklandca.gov/Planning-Building/Building-Construction-Permits-Inspections/Utilities/Requirements-for-Inspection-of-Electric-and-Gas-Utilities
      page: null
    - item: Site photos, site plan, method of screening, elevations and/or vendor cut sheet (if relocating a meter to a street-facing location)
      section: site_plan
      quote: In the Worksheet, upload your all site photos, a site plan, method of screening, elevations and/or a cut sheet for vendor.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Utility-Meters
      page: null
  subpanel:
    permit_required:
      value: true
      quote: You need a permit before you install, change, fix, or replace mechanical, electrical, or plumbing systems.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Mechanical-Electrical-Plumbing-MEP-Permits
    plans_required_single_family:
      same_as: service_upgrade
    load_calculation:
      method: not_stated
      city_worksheet: none
      ev_charger_load_factor: not_stated
      quote: unknown
      url: unknown
    sheet_requirements:
      same_as: ev_charger
    requirements:
    - item: Online Residential Electrical Permit (RE) application via Online Permit Center
      section: application
      quote: Your permits will be issued right after you submit your application and pay the fees.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Mechanical-Electrical-Plumbing-MEP-Permits
      page: null
  appliance_circuit:
    permit_required:
      same_as: subpanel
    plans_required_single_family:
      same_as: service_upgrade
    load_calculation:
      method: not_stated
      city_worksheet: none
      ev_charger_load_factor: not_stated
      quote: unknown
      url: unknown
    sheet_requirements:
      same_as: ev_charger
    requirements:
    - item: Online Residential Electrical Permit (RE) application via Online Permit Center
      section: application
      quote: 'Electrical Permits: for wiring, lights, outlets, or circuits. Visit for: Commercial Electrical Permits or Residential Electrical Permits.'
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Mechanical-Electrical-Plumbing-MEP-Permits
      page: null
  generator:
    permit_required:
      value: true
      quote: Installed generators require Zoning Review. Electrical, and Plumbing Permits (for natural gas generators) are required.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Generators
    plans_required_single_family:
      value: true
      conditions: Zoning Review requires a site plan, site photos, elevations and/or vendor cut sheet. Large generators also require a Building Permit with structural calculations and plans for equipment anchorage.
      quote: Upload structural calculations, plans, and all associated documents to the Worksheet.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Generators
    load_calculation:
      method: not_stated
      city_worksheet: none
      ev_charger_load_factor: not_stated
      quote: unknown
      url: unknown
    sheet_requirements:
      same_as: ev_charger
    requirements:
    - item: Zoning Worksheet with Basic Application for Development Review, site photos, site plan, elevations and/or vendor cut sheet
      section: site_plan
      quote: In the Worksheet, upload your completed Basic Application for Development Review(PDF, 5MB) including all site photos, a site plan, elevations and/or a cut sheet for vendor.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Generators
      page: null
    - item: Noise compliance documentation or test per Planning Code OMC 17.120.050 (may be requested at final inspection)
      section: other
      quote: An inspector may request a noise test or documentation of this before your permit is finaled.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Generators
      page: null
  solar_storage:
    permit_required:
      value: true
      quote: Input the SolarAPP+ approval number and attach the SolarAPP+ Approval Document to proceed.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Solar-Energy-Systems-Facilities
    plans_required_single_family:
      value: true
      conditions: Main dwelling rooftop residential PV with battery backup may apply via SolarAPP+ (California Licensed Contractors Only). Energy storage systems require Fire Prevention Bureau approval where a single battery has a capacity greater than 20 kWh.
      quote: 'Energy storage systems will require approval from the Fire Prevention Bureau where: 1.) a single battery has a capacity greater than 20 kWh; 2.)'
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Solar-Energy-Systems-Facilities
    load_calculation:
      method: not_stated
      city_worksheet: none
      ev_charger_load_factor: not_stated
      quote: unknown
      url: unknown
    sheet_requirements:
      same_as: ev_charger
    requirements:
    - item: SolarAPP+ Approval Document and approval number
      section: application
      quote: Input the SolarAPP+ approval number and attach the SolarAPP+ Approval Document to proceed.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Solar-Energy-Systems-Facilities
      page: null
    - item: SolarAPP+ Spec Sheet and Contractors Declaration Form
      section: equipment
      quote: Attach the SolarAPP+ Spec Sheet. Attach your Contractors Declaration Form.
      url: https://www.oaklandca.gov/My-Household/Building-and-Remodeling/Homeowner-Projects-Permits/Solar-Energy-Systems-Facilities
      page: null
