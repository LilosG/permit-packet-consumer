open_questions:
  - "Portland Permitting & Development (PP&D) does not publish a city-specific residential electrical load calculation worksheet or specify whether NEC 220.82 or 220.83 is required; confirming whether standard single-family trade permits without plan review require submitting a load calculation would require contacting PP&D Electrical Inspections directly."
  - "No Portland-specific single-family Level 2 EV charger load factor (e.g., 100% vs. 125%) is stated on portland.gov; Oregon BCD Statewide Alternate Method 09-01 addresses demand factors for multiple charging stations rather than a single residential EV charger."