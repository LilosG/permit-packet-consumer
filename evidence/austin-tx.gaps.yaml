open_questions:
  - "No City of Austin residential electrical load calculation worksheet, required NEC Article 220 method (such as 220.82 or 220.83), or EV charger load factor is published on austintexas.gov or austinenergy.com. Austin Energy's Electric Service Planning Application (ESPA) requests 'Total NEC-Calculated Load (amps)' without specifying a calculation method; confirm directly with Austin DSD Residential Plan Review or on https://www.austintexas.gov/development-services/apply-standalone-permit."