jurisdiction_key: denver-co
city: Denver
state: CO
checked_on: 2026-11-24
agency: Denver Community Planning and Development
portal_url: https://aca-prod.accela.com/denver/default.aspx
code_edition:
  value: "2026 National Electrical Code (NEC) / NFPA 70 (unamended)"
  effective_date: unknown
  quote: "Denver also adopts and enforces the 2026 edition of the National Electrical Code (NEC) / NFPA 70, which is adopted unamended"
  url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Commercial-and-Multifamily-Projects/Commercial-Permitting-Guide
who_may_file:
  owner_may_file: true
  conditions: "Homeowner (owner-occupier) must pass the Electrical exam (or hold a state electrical license) and submit Quick Permit applications by email to planreview@denvergov.org; homeowners are not eligible to apply for Quick Permits through E-permits."
  quote: "A homeowner (owner-occupier) or legally authorized agent obtaining permits is not eligible to apply for Quick Permits through the E-permits system. Instead, applications must be submitted by email."
  url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/How-to-Apply/Homeowner-Permits
utility:
  name: "Xcel Energy (Public Service Company of Colorado)"
  requirements:
    - item: "Submit service request with service details (voltage, phase, amps) and site plan via Builders Call Line or online"
      quote: "The load specifications for your service (voltage, phase, amps, BTUs, etc.). Please submit a site plan or development plat with your application."
      url: https://www.xcelenergy.com/staticfiles/xe-responsive/Archive/2024%20CO%20Service%20Guide.pdf
    - item: "Install an electric heavy-duty lever bypass (HDLB) meter socket per Xcel Energy Blue Book Section 4.11"
      quote: "An electric heavy-duty lever bypass (HDLB) meter socket is installed. Please see section 4.11 Meter Socket in the Xcel Energy Standards of Installation and Use Manual."
      url: https://www.xcelenergy.com/staticfiles/xe-responsive/Archive/2024%20CO%20Service%20Guide.pdf
    - item: "Public authority must submit an approved inspection certificate to Xcel Energy Builders Call Line before meter set"
      quote: "Prior to the scheduling of your meter installation, Xcel Energy must receive an approved inspection certificate."
      url: https://www.xcelenergy.com/staticfiles/xe-responsive/Archive/2024%20CO%20Service%20Guide.pdf
    - item: "Submit DER interconnection application online with Site Plan and Line Diagram; inverter must be UL 1741 certified"
      quote: "ALL INVERTER EQUIPMENT MUST BE UL. 1741 CERTIFIED"
      url: https://www.xcelenergy.com/staticfiles/xe-responsive/Working%20With%20Us/Renewable%20Developers/CO_DER%20Interconnection%20Portal_Process%20Guide_2022-05.pdf
jobs:
  ev_charger:
    permit_required:
      value: yes
      quote: "Quick permits are trade-specific permits that can be issued without the need for a plan review or a Building Log."
      url: https://denvergov.org/files/assets/public/v/6/community-planning-and-development/documents/ds/building-codes/policies/admin-131a.pdf
    plans_required_single_family:
      value: depends
      program_name: "Quick Permits (E-permits)"
      quote: "For electrical, plumbing, roofing, or similar replacements on single-family homes, duplexes, or limited commercial/multifamily buildings. These types of permits are issued without plan review except for work on individual landmarks and properties in historic districts."
      url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/E-permits/E-permits-Application-Guide
    checklist_published: false
    checklist:
      title: "ADMIN 131A - Permit Application and Issuance"
      revision_date: "January 24, 2025"
      url: https://denvergov.org/files/assets/public/v/6/community-planning-and-development/documents/ds/building-codes/policies/admin-131a.pdf
    requirements:
      - item: "Contractors apply electronically through E-permits under Quick Permits; homeowners email Quick Permit application to planreview@denvergov.org"
        section: application
        quote: "Applications for quick permits on commercial and residential projects shall be submitted electronically through e-permits by selecting a permit type under the category “Quick Permits.”"
        url: https://denvergov.org/files/assets/public/v/6/community-planning-and-development/documents/ds/building-codes/policies/admin-131a.pdf
        page: 1
      - item: "Homeowner (owner-occupier) must pass the Electrical exam (or hold a state license) and submit passing documentation"
        section: application
        quote: "Pass the applicable exam(s) and submit passing documentation demonstrating your knowledge and ability to perform the work."
        url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/How-to-Apply/Homeowner-Permits
        page: null
    load_calculation:
      method: not_stated
      city_worksheet: "none"
      ev_charger_load_factor: not_stated
      quote: "unknown"
      url: unknown
    sheet_requirements:
      sheet_size: "not_stated"
      copies_or_format: "Electronic via E-permits (Quick Permits or Building Log); email to planreview@denvergov.org for homeowner Quick Permits"
      signature_or_stamp: "not_stated"
      quote: "Applications for permits on commercial and residential projects shall be submitted electronically through e- permits (www.denvergov.org/epermits) by selecting “Building Log” under the category “Submit Building Plans for Review.”"
      url: https://denvergov.org/files/assets/public/v/6/community-planning-and-development/documents/ds/building-codes/policies/admin-131a.pdf
    local_rules:
      - rule: "Exterior work in a landmark/historic area cannot be permitted online"
        quote: "Exterior work (including roofs) in a landmark/historic area cannot be permitted online."
        url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/E-permits
    searched:
      - "site:denvergov.org \"electric vehicle\" OR \"EV charger\" permit residential"
      - "site:denvergov.org \"Quick Permits\" electrical \"service\" OR \"panel\" OR \"EV\" OR \"charger\""
