  generator:
    permit_required:
      value: yes
      quote: "A zoning permit is required for solar panels that are not building-mounted and generators on the exterior of the structure."
      url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
    plans_required_single_family:
      value: unknown
      program_name: "none"
      quote: "unknown"
      url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
    checklist_published: false
    checklist:
      title: "unknown"
      revision_date: "unknown"
      url: unknown
    requirements:
      - item: "Zoning permit required if generator is located on the ground / exterior of the structure"
        section: site_plan
        quote: "A zoning permit is required if the panels will be installed on the ground or if a generator is part of the project and will be located on the ground."
        url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
        page: null
    load_calculation:
      same_as: ev_charger
    sheet_requirements:
      same_as: ev_charger
    local_rules: []
    searched:
      - "site:denvergov.org \"Quick Permits\" electrical \"generator\""
  solar_storage:
    permit_required:
      value: yes
      quote: "All systems require an electrical permit."
      url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
    plans_required_single_family:
      value: depends
      program_name: "SolarAPP+ Electrical Quick Permit or Building Log Plan Review"
      quote: "Some solar panel projects on single-family/duplex homes are eligible for an Electrical Quick Permit. See the SolarAPP+ dropdown to see which projects qualify."
      url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
    checklist_published: true
    checklist:
      title: "Solar Permits for Photovoltaic and Hot Water Panels"
      revision_date: "unknown"
      url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
    requirements:
      - item: "For SolarAPP+, upload unique SolarAPP+ ID number and approval documents under Quick Permits > Electrical Permit"
        section: application
        quote: "If your project is approved, you will receive a unique SolarAPP+ ID number and approval documents. Gather your ID number and approval documents and log in to e-permits."
        url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
        page: null
      - item: "Non-SolarAPP+ systems <10 kW require review of non-engineered electrical plans via Building Log"
        section: one_line
        quote: "Systems rated under 10 kW will not require engineered electrical plans, but do still require a review of non-engineered electrical plans."
        url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
        page: null
      - item: "Non-SolarAPP+ systems >=10 kW require stamped and signed engineered electrical plans via Building Log"
        section: one_line
        quote: "For systems 10 kW in size and over, stamped and signed(PDF, 1023KB), engineered plans must be uploaded."
        url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
        page: null
      - item: "Zoning permit required if solar panels are installed on the ground"
        section: site_plan
        quote: "A zoning permit is required if the panels will be installed on the ground or if a generator is part of the project and will be located on the ground."
        url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
        page: null
    load_calculation:
      same_as: ev_charger
    sheet_requirements:
      sheet_size: "not_stated"
      copies_or_format: "Electronic PDF upload via E-permits (Quick Permits for SolarAPP+, Building Log otherwise)"
      signature_or_stamp: "Stamped and signed engineered plans required for systems 10 kW and over"
      quote: "For systems 10 kW in size and over, stamped and signed(PDF, 1023KB), engineered plans must be uploaded."
      url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
    local_rules:
      - rule: "SolarAPP+ Quick Permit limited to licensed electricians, 1-2 family, <=400A service, <10 kW DC; may include ESS, panel upgrade/derating if PV-related"
        quote: "Single-family and duplex homes. With utility service of 400 amps or less. kW DC rating of less than 10. Scope of work can include energy storage systems, main panel upgrades, and main panel deratings only if related to the PV system installation."
        url: https://www.denvergov.org/Government/Agencies-Departments-Offices/Agencies-Departments-Offices-Directory/Community-Planning-and-Development/Plan-Review-Permits-and-Inspections/Single-Family-and-Duplex-Projects/Solar-Permits
    searched:
      - "site:denvergov.org \"battery\" OR \"energy storage\" OR \"ESS\" residential permit"
