open_questions:
  - "MEPTradeTraining.pdf (https://docsonline.sanantonio.gov/DSDUploads/MEPTradeTraining.pdf) states broadly that residential property owners may apply for a 'MEP Trade permit' for an existing homestead residence when personally performing the work, whereas https://www.sa.gov/Directory/Departments/DSD/Constructing/Residential/Permits and https://www.sa.gov/Directory/Departments/DSD/Resources/Getting-Started explicitly state a homeowner can only apply for a plumbing permit (and Chapter 10 in https://docsonline.sanantonio.gov/DSDUploads/2024Ch10Building-RelatedCodesFinal.pdf only lists a homestead homeowner exemption for plumbing). Full review of Sec. 10-113 of 2024Ch10Building-RelatedCodesFinal.pdf would confirm whether any electrical homestead exemption exists in City Code."
  - "IB 250 (https://docsonline.sanantonio.gov/FileUploads/DSD/IB250.pdf) specifies 2023 NEC Article 220 for residential electrical back-up systems (generators, ESS/batteries, roof-mounted solar PV) under third-party review, without specifying NEC 220.82 vs. 220.83; no official City of San Antonio or CPS Energy document was found specifying a mandatory NEC 220 sub-method, city load calculation worksheet, or EV charger load factor for standalone residential EV chargers, service upgrades, subpanels, or 240 V appliance circuits."