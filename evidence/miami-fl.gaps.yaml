  effective_date: 2023-12-31
  quote: Florida Building Code- Residential / 8th Edition (2023) Florida Fire Prevention Code / 8th Edition. National Electrical Code (NEC) / (NFPA 70) / 2020 Edition.
  url: https://www.miami.gov/My-Government/Departments/Building/Building-Services/State-of-Florida-Applicable-Codes
who_may_file:
  owner_may_file: true
  conditions: Strictly limited to owner-occupied one-family and two-family residential work only; requires in-person interview and test at Miami Riverside Center (444 SW 2nd Ave, 1st Floor), proof of residency (ID with property address and utility bill), and a signed and notarized Owner-Builder disclosure statement.
  quote: Please note that the City of Miami strictly limits Owner-Builder permits to owner-occupied One-family and Two-family residential work only.
  url: https://www.miami.gov/Permits-Construction/Remodeling-and-Construction/Become-an-Owner-Builder
