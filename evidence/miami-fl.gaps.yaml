      page: null
    - item: Product equipment specifications, manufacturer material data sheets, and storage battery size, type, and location (if used)
      section: equipment
      quote: Product equipment specifications and material data sheet from the manufacturer. If storage batteries are used, indicate size, type and location.
      url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
      page: null
    - item: Transfer switch (manual or automatic) and switching equipment detail from and to the public utility electrical system
