jurisdiction_key: san-diego-ca
city: San Diego
state: CA
checked_on: 2026-11-24
agency: City of San Diego Development Services Department
portal_url: https://www.sandiego.gov/development-services/permits/electrical-permit
code_edition:
  value: 2025 California Electrical Code, California Code of Regulations Title 24, Part 3
  effective_date: 2026-01-01
  quote: "When reference is made to the California Electrical Code, it shall be the 2025 California Electrical Code, California Code of Regulations Title 24, Part 3"
  url: https://municode.sandiego.gov/doc-viewer.aspx?secid=11855
who_may_file:
  owner_may_file: true
  conditions: "Owner-Builder Verification form (DS-3042) must be completed and signed by the owner if the property owner is doing the work."
  quote: "If the property owner is doing the work, a separate Owner-Builder Verification form (DS-3042) must be completed and signed by the owner."
  url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/187
utility:
  name: San Diego Gas & Electric
  requirements:
    - item: Apply for Change to Existing Service for renovations or upgrades changing electrical power needs
      quote: "Change to Existing Service. The property already has a meter. You're doing a renovation or upgrade that significantly changes the electrical or gas power needs."
      url: https://www.sdge.com/apply-service
    - item: Submit online service request with current and proposed panel size and additional loads
      quote: "For electric service, current and proposed panel size and additional loads."
      url: https://www.sdge.com/businesses/savings-center/services/service-planning-for-expansion-relocation
    - item: Obtain SDG&E approval before energizing solar PV systems after City final inspection
      quote: "After receiving final inspection approval for all related City of San Diego Approvals (permits), San Diego Gas and Electric (SDG&E) will be notified. The system is not approved to energize until SDG&E approval is obtained."
      url: https://www.sandiego.gov/sites/default/files/solar_pv.pdf
jobs:
  ev_charger:
    permit_required:
      value: yes
      quote: "An Electrical Permit is required for the installation of an EVCS."
      url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/187
    plans_required_single_family:
      value: no
      program_name: Simple Permits
      quote: "EVCS installed for single dwelling units, duplexes, or townhouses qualify for Simple Permits and do not require plans for review."
      url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/187
    checklist_published: false
    checklist:
      title: unknown
      revision_date: unknown
      url: unknown
    requirements:
      - item: Completed City of San Diego Circuit Card DS-1779A on site for inspection
        section: panel_schedule
        quote: "In lieu of plans, a completed City of San Diego Circuit Card (DS- 1779A) will be required for residential private garages (inside/outside)."
        url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/187
        page: null
      - item: Load calculations included on Circuit Card DS-1779A
        section: load
        quote: "Load calculations must be included on the Circuit Card. The Circuit Card must be provided at the site for the inspection staff with listing equipment."
        url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/187
        page: null
      - item: EVCS manufacturer installation instructions provided on site
        section: equipment
        quote: "In addition to all plans and calculations, the EVCS manufacturer's installation instructions shall be provided on site."
        url: https://www.sandiego.gov/sites/default/files/2025-04/ib-187-how-to-obtain-a-permit-for-electric-vehicle-charging-systems-city-www.sandiego.gov_.pdf
        page: null
      - item: Owner-Builder Verification form DS-3042 if owner performs work
        section: application
        quote: "If the property owner is doing the work, a separate Owner-Builder Verification form (DS-3042) must be completed and signed by the owner."
        url: https://www.sandiego.gov/development-services/forms-publications/information-bulletins/187
        page: null
    load_calculation:
      method: nec_220_82
      city_worksheet: "Circuit Card (Supplemental) DS-1779A - https://www.sandiego.gov/sites/default/files/legacy/development-services/pdf/industry/forms/ds1779a.pdf"
      ev_charger_load_factor: not_stated
      quote: "Optional Method: 2025 California Electrical Code Section 220-82 (based on 2023 NEC) As an alternative, the STANDARD METHOD found in Article 220 may be used."
      url: https://www.sandiego.gov/sites/default/files/legacy/development-services/pdf/industry/forms/ds1779a.pdf
    sheet_requirements:
      sheet_size: not_stated
      copies_or_format: not_stated
      signature_or_stamp: not_stated
      quote: "not_stated"
      url: unknown
    local_rules:
      - rule: EVCS load entered on DS-1779A at 7200 VA or nameplate per 220-57
        quote: "9. EVCS Load (220-57) at 7200 VA or name plate"
        url: https://www.sandiego.gov/sites/default/files/legacy/development-services/pdf/industry/forms/ds1779a.pdf
      - rule: Enclosures and connectors mounted 36 to 48 inches above ground unless manufacturer specifies otherwise
        quote: "All enclosures shall have a mounting height between 36\" and 48\". Connector height shall be between 36\" and 48\" from the ground (CEC 625.29) unless otherwise indicated by the manufacturer."
        url: https://www.sandiego.gov/sites/default/files/2025-04/ib-187-how-to-obtain-a-permit-for-electric-vehicle-charging-systems-city-www.sandiego.gov_.pdf
    searched:
      - "site:sandiego.gov \"Information Bulletin 187\" OR \"IB-187\" EV charger residential"
      - "site:sandiego.gov \"DS-1779A\" OR \"DS-1779\" \"220-82\" OR \"220.82\" OR \"Circuit Card\""
