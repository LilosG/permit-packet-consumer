open_questions:
  - "No San Francisco DBI page or PDF specifies a mandatory NEC/CEC Article 220 residential load calculation method (e.g., 220.82 vs. 220.83), a downloadable residential load calculation worksheet, or an EV charger load factor percentage for service upgrades, subpanels, 240 V appliance circuits, standby generators, or solar-plus-storage; Information Sheet E-02 (https://media.api.sf.gov/documents/IS_E-02.EV.Charging_Final_Signed.pdf) only cites 'Electrical load calculation and panel schedule (CEC 220)' for EVSE installations, and SFBC Section 106A.1.15 (https://media.api.sf.gov/documents/2025_SFBC_Amendments.pdf) references 'a completed Department service load calculation form' for expedited small residential rooftop solar without publishing a standalone form PDF on sf.gov."
  - "Full text of SFEC Section 89.120(E) in https://media.api.sf.gov/documents/2025_SF_Electrical_Code.pdf should be checked in a browser to confirm whether any owner-occupancy duration or rental restriction beyond the single-family dwelling, self-performance, and non-LLC rules is stated."