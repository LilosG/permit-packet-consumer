who_may_file:
  owner_may_file: true
  conditions: "Single-family dwelling only; homeowner must perform the electrical work themselves and sign the declaration not to hire a contractor (SFEC Section 89.120(E)); LLCs are not eligible; must present ID to prove ownership (plus proof of ownership if recently purchased, or proof of authorized signatory status if owned by a trust). If work fails to comply with SFEC and corrections are not made as required by DBI, deficiencies must be corrected by a State licensed electrical contractor under a separate permit. Note: Solar PV and energy storage permits are restricted to California-licensed contractors (C-10, or C-46 without battery storage)."
  quote: "Permits for electrical work in or about a single-family dwelling may be issued to the homeowner, provided the work will be performed by the homeowner."
  url: https://www.sf.gov/sites/default/files/2023-11/IS%20E-03.pdf
