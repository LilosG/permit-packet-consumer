open_questions:
  - "Information Bulletin 103 (https://www.sandiego.gov/development-services/forms-publications/information-bulletins/103) lists 'Generator Only, Each. $176.57. Not applicable. No' in its fee table, but the full table row and column headers confirming whether residential standby generators always require plans (i.e., do not qualify for Simple Permits - MEP) should be verified directly on IB-103."
  - "Information Bulletin 301 (https://www.sandiego.gov/development-services/forms-publications/information-bulletins/301) specifies structural calculations for roof/PV dead load but does not explicitly state an electrical load calculation method for rooftop solar with battery storage; verify with DSD whether Form DS-1779A is required when a service/panel upgrade or ESS backup load is included."