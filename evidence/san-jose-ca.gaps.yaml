  solar_storage:
    permit_required:
      value: yes
      quote: "A building permit is required before installing solar photovoltaic (PV) panels and/or energy storage batteries. For qualifying projects, it is easy to get the permit online."
      url: https://www.sanjoseca.gov/businesses/development-services-permit-center/start-your-project/single-family-duplex-properties/solar-storage-battery-projects
    plans_required_single_family:
      value: yes
      conditions: "Qualifying rooftop solar/battery installations on single-family, duplex, or townhouse properties (non-ballasted, <5 psf, <40 lb concentrated load, <=18 in height) can obtain an online permit at SJPermits.org with field review of plans; nonqualifying projects require Standard Plan Review."
      quote: "Some, such as solar installations and earthquake retrofits, require plans that the City Inspector will review in the field during inspection of the project."
      url: https://www.sanjoseca.gov/business/development-services-permit-center/online-permits-at-sjpermits-org/building-online-permits
    load_calculation:
      method: "not_stated"
