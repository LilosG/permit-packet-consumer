jurisdiction_key: san-jose-ca
city: San Jose
state: CA
checked_on: 2026-11-25
code_edition:
  value: "2025 California Electrical Code (CCR Title 24 Part 3), adopted statewide by the California Building Standards Commission; local San Jose amendments not confirmed in retrieved snippets"
  effective_date: 2026-01-01
  quote: "Plans submitted after Jan 1, 2026 will be reviewed under the 2025 codes (including Building, Electrical, Plumbing, Mechanical, Residential, Fire, CALGreen, and Energy)."
  url: https://www.sanjoseca.gov/your-government/departments-offices/planning-building-code-enforcement/building-division/adopted-building-codes
who_may_file:
  owner_may_file: true
  conditions: "Property owner must submit Form 311 (Owner-Builder Acknowledgement and Verification of Information Form) when signing as Owner-Builder; specific occupancy or rental limits inside Form 311 were not opened."
  quote: "Who can apply? Only property owners and qualified contractors may apply for an online building permit."
  url: https://www.sanjoseca.gov/business/development-services-permit-center/online-permits-at-sjpermits-org/building-online-permits
jobs:
  ev_charger:
    permit_required:
      value: yes
      quote: "A Level 2 station requires an electrical permit; depending on the manufacturer, it may also require a mechanical permit."
      url: https://www.sanjoseca.gov/businesses/development-services-permit-center/start-your-project/electric-vehicle-charging-stations
    plans_required_single_family:
      value: not_stated
      conditions: "Single-family/duplex properties obtain an online permit at SJPermits.org; load calculations are required when the existing service panel rating is 125 amperes or less."
      quote: "unknown"
      url: unknown
    load_calculation:
      method: "California Electrical Code Article 220"
      city_worksheet: "none"
      ev_charger_load_factor: "125%"
      quote: "Load calculations must include 125% of the maximum EV charging load and be provided when the service panel rating is 125 amperes or less (California Electrical Code Article 220)."
      url: https://www.sanjoseca.gov/businesses/development-services-permit-center/start-your-project/electric-vehicle-charging-stations
    sheet_requirements:
      sheet_size: "not_stated"
      copies_or_format: "Online permit at SJPermits.org"
      signature_or_stamp: "not_stated"
      quote: "unknown"
      url: unknown
    requirements:
      - item: "Existing electrical service panel rating, EV charging system load, and circuit size"
        section: load
        quote: "Specify the panel rating of the existing electrical service, for example, 200 amp service, at the residence. Indicate the EV charging system load and circuit size."
        url: https://www.sanjoseca.gov/businesses/development-services-permit-center/start-your-project/electric-vehicle-charging-stations
        page: null
      - item: "Load calculations including 125% of maximum EV charging load when service panel rating is 125 A or less"
        section: load
        quote: "Load calculations must include 125% of the maximum EV charging load and be provided when the service panel rating is 125 amperes or less (California Electrical Code Article 220)."
        url: https://www.sanjoseca.gov/businesses/development-services-permit-center/start-your-project/electric-vehicle-charging-stations
        page: null
      - item: "Plans (if any) and manufacturer instructions available on-site at inspection"
        section: equipment
        quote: "Have plans and manufacturer instructions, if any, available. Ensure there is access to all areas of the project work; provide a ladder if one is needed."
        url: https://www.sanjoseca.gov/businesses/development-services-permit-center/start-your-project/electric-vehicle-charging-stations
        page: null
