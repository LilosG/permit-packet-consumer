who_may_file:
  owner_may_file: unknown
  conditions: "State law exempts homeowners who own and reside in a dwelling from state electrician licensing (Tex. Occ. Code 1305.003(a)(6)), unless regulated by city ordinance; Houston Permitting Center electrical permit pages state 'Registered electrical contractors' must apply."
  quote: "Also, there is an exemption for homeowners who reside in the home to do the work if the electrical work is not regulated by city ordinance."
  url: https://www.tdlr.texas.gov/electricians/compliance-guide.htm
utility:
  name: "CenterPoint Energy Houston Electric"
  requirements:
    - item: "Meter socket base must be installed outdoors, centered 4 to 6 feet above ground, with 36-inch front clearance"
      quote: "A METER SOCKET BASE FURNISHED AND INSTALLED BY CUSTOMER WITH CENTER NOT LESS THAN 4 OR MORE THAN 6' ABOVE GROUND. THE METER SOCKET BASE IS TO BE INSTALLED OUTDOOR."
      url: https://assets.centerpointenergy.com/api/public/content/996dd598cf3546f9a6f0c4d1371491f9?v=224b73c4
    - item: "Only ring-type UL 414 meter sockets accepted; 125A/200A cans require tamper-proof lids; bypass devices not allowed"
      quote: "ALL SINGLE PHASE 125A AND 200A CANS WILL BE PROVIDED WITH TAMPER PROOF LIDS. ONLY RING TYPE METER SOCKETS WILL BE ACCEPTED."
      url: https://assets.centerpointenergy.com/api/public/content/996dd598cf3546f9a6f0c4d1371491f9?v=224b73c4
    - item: "Meter mounting device shall not be used for a supply-side tap to interconnect Electric Power Production Sources"
      quote: "In addition, the Meter Mounting Device shall not be used for a supply side tap to interconnect Electric Power Production Sources"
      url: https://mugprojectportal.centerpointenergy.com/services-standards.pdf
    - item: "Submit formal solar interconnection application, sign Interconnection Agreement (ICA), and obtain Permission to Operate (PTO)"
      quote: "Approve and issue the Interconnection Agreement (ICA) and Permission to Operate (PTO). Maintain and operate the Utility meter device on site (automatically, remotely reprogrammed to capture excess generation export readings)."
      url: https://www.centerpointenergy.com/zh-us/our-services/electric-utility/technology/solar-energy
