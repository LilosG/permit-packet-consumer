    permit_required:
      value: yes
      quote: "Certain work valued at less than $7,500 on a single-family dwelling may be exempt from the requirement to obtain a building permit. This exemption does not apply to: * Work on property located partially or entirely in a flood hazard area. * Electrical work."
      url: https://www.miami.gov/My-Government/Departments/Building/Building-Updates/Legislative-Updates-Building
    plans_required_single_family:
      value: unknown
      program_name: "iBuild / ePlan (ProjectDox)"
      quote: "To apply for a Building permit, access iBuild portal."
      url: https://www.miami.gov/Services/Guide-to-Getting-a-Permit
