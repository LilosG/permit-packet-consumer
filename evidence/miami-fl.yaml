      quote: "unknown"
      url: unknown
    sheet_requirements:
      sheet_size: "8.5x11 (2x2 blank corner), 11x17 (3x3 blank corner), or 24x36/30x42/36x48 (4.5x4.5 blank corner)"
      copies_or_format: "Unencrypted PDF uploaded to ProjectDox (max 1 GB/file); one file per drawing sheet, landscape only, uppercase naming"
      signature_or_stamp: "not_stated"
      quote: "Each drawing page must be uploaded as a separate file. (i.e. If there at 20 pages that makes up your MEP drawings, each page should be named and uploaded individually)."
