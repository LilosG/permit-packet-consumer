code_edition:
  value: "2020 National Electrical Code (NFPA 70), adopted by the Florida Building Code 8th Edition (2023)"
  effective_date: 2023-12-31
  quote: "National Electrical Code (NEC) / (NFPA 70) / 2020 Edition."
  url: https://www.miami.gov/My-Government/Departments/Building/Building-Services/State-of-Florida-Applicable-Codes
who_may_file:
  owner_may_file: true
  conditions: "Strictly limited to owner-occupied one- and two-family residential work; requires in-person interview, written test, proof of residency (ID + utility bill), and signed/notarized Owner-Builder disclosure statement at MRC 444 SW 2nd Ave"
  quote: "Please note that the City of Miami strictly limits Owner-Builder permits to owner-occupied One-family and Two-family residential work only."
  url: https://www.miami.gov/Permits-Construction/Remodeling-and-Construction/Become-an-Owner-Builder
utility:
  name: Florida Power & Light (FPL)
  requirements:
    - item: "Local authority inspection and formal notice required before FPL energizes new or upgraded service"
      quote: "FPL cannot energize new service installations until such inspection has been made, and until formal notice from the inspecting authority has been received by FPL."
      url: https://www.fpl.com/partner/pdf/electric-service-standards-general.pdf
    - item: "Meter enclosures must be on FPL's Approved Meter Equipment Enclosure List"
      quote: "The meter enclosure must be on FPL's approved list."
      url: https://www.fpl.com/partner/pdf/electric-service-standards-meter-connections.pdf
    - item: "Net Metering application, agreement, and approved building permit required for solar interconnection"
      quote: "Once an approved system is installed, and a Net Metering Application, a Net Metering Agreement and an approved building permit are received and accepted by FPL, a special billing meter that measures the quantity and direction in which the electricity is flowing, is installed."
      url: https://www.fpl.com/netmetering.html
    - item: "Generator transfer equipment must be NRTL-listed (UL 1008, UL 67, UL 98, or UL 891) and labeled suitable per NEC Article 702"
      quote: "In such cases, the Customer shall provide a transfer device which meets the National Electrical Code and is listed and labeled by a Nationally Recognized Test Lab (NRTL), such as U.L., to a standard equal to U.L. 1008 Transfer Switch Equipment"
      url: https://www.fpl.com/partner/pdf/electric-service-standards-general.pdf
jobs:
