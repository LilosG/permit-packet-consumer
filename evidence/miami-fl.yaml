      value: yes
      program_name: "Standalone Electrical Permit (Solar Panel) via iBuild + ePlan (expedited and free)"
      quote: "Get a Solar Permit. Solar permits are both expedited and free!"
      url: https://www.miami.gov/My-Government/Climate-Change-in-the-City-of-Miami/Solar
    checklist_published: true
    checklist:
      title: "Get a Permit to Install Solar Panels"
      revision_date: "unknown"
      url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
    requirements:
      - item: "Permit application signed by both owner and contractor and notarized for both signatures"
        section: application
        quote: "Permit application, signed by owner & contractor and notarized for both signatures. This application will be printed after you apply online, below."
        url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
        page: null
      - item: "Plans with riser diagram, OCP/equipment sizes, inverter/PV specs, NEC 705.12(D) (120%) compliance, labels, and mounting details"
        section: one_line
        quote: "Riser diagram showing existing equipment sizes and OCP size. DC/AC inverter specifications and photovoltaic panel specifications. Diagram of both systems integrated/interconnected. Show all labels required on equipment."
        url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
        page: null
      - item: "Two copies of a signed and sealed Florida P.E. structural letter for normal and hurricane FBC wind conditions"
        section: other
        quote: "Provide 2 copies of a letter signed and sealed by a Florida P.E. stating that the installation of the Photovoltaic system will not adversely affect the building structure under normal conditions and during a hurricane event of the Florida Building Code specified intensity."
        url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
        page: null
      - item: "Manufacturer equipment specs, battery size/type/location (if used), and manual/automatic transfer switch details"
        section: equipment
        quote: "If storage batteries are used, indicate size, type and location. Indicate transfer switch, manual or automatic. Detail to be shown for all switching equipment and methods from and to public utility electrical system."
        url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
        page: null
    load_calculation:
      method: not_stated
      city_worksheet: "none"
      ev_charger_load_factor: not_stated
      quote: "Verify existing service to qualify for panel installation."
      url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
    sheet_requirements:
      sheet_size: "8.5x11 (2x2 blank corner), 11x17 (3x3 blank corner), or 24x36/30x42/36x48 (4.5x4.5 blank corner)"
      copies_or_format: "Electronic PDF upload via ePlan (ProjectDox) or in-person submittal at 444 SW 2nd Ave, 4th Floor"
      signature_or_stamp: "Signed and sealed by a Florida licensed Engineer (or prepared by a qualifying EC or CVC contractor for projects < $50,000)"
      quote: "One set of plans signed and sealed by a Florida licensed Engineer. For projects less than $50,000 plans may be prepared by a qualifying contractor with an EC or CVC license."
      url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
    local_rules:
      - rule: "Qualified solar contractor must hold an EC or CVC license; residential solar does not need a separate roofing permit"
        quote: "A qualified contractor is one who holds an EC or CVC license only. Reminder: if you're applying for a residential project you do not need a separate roofing permit"
        url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
      - rule: "Solar plans must show compliance with NEC 705.12D (120%) and all components/PV cables must be UL Listed"
        quote: "Compliance with NEC 705.12D (120%) Provide support and mounting detail. All components and PV cables shall be UL Listed."
        url: https://www.miami.gov/Permits-Construction/Permit-Catalog/Get-a-Permit-to-Install-Solar-Panels
    searched:
      - "site:miami.gov \"Get a Permit to Install Solar Panels\" OR \"solar\" permit"
      - "site:miami.gov \"ePlan\" OR \"ProjectDox\" sheet size OR PDF OR \"digital signature\""
open_questions:
  - "No dedicated City of Miami single-family residential electrical submittal checklist was found on miami.gov for standalone Level 2 EV chargers, main panel/service upgrades (beyond 'SERVICE REPAIR (Residential Only)' under Easy Permits), subpanels, 240 V appliance circuits (hot tubs/saunas/heat pumps beyond A/C change-outs), or standby/portable generators."
  - "The Owner Affidavit of Exemption PDF linked on https://www.miami.gov/Permits-Construction/Permitting-Resources/Permitting-Forms-Documents could not be opened directly to verify any additional electrical-specific conditions for Owner-Builder permits beyond the interview, test, residency proof, and disclosure statement listed on https://www.miami.gov/Permits-Construction/Remodeling-and-Construction/Become-an-Owner-Builder."
  - "No City of Miami-published residential electrical load calculation worksheet, mandatory NEC 220 method (220.82 vs. 220.83 vs. 220.87), or EV charger service load factor was found on miami.gov."