        section: application
        quote: "To apply for a Building permit, access iBuild portal."
        url: https://www.miami.gov/Services/Guide-to-Getting-a-Permit
        page: null
      - item: "Documents and plans uploaded to ProjectDox (ePlan) if plan review is required"
        section: application
        quote: "ProjectDox serves as an integral component of this process, providing a platform for uploading required documents and plans, as well as for reviewing and responding to comments from City of Miami staff."
        url: https://www.miami.gov/Services/Guide-to-Getting-a-Permit
