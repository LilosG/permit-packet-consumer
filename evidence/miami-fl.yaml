      - rule: "Owner-builders cannot request trade sub-permit inspections; electrical sub-contractors must request their own inspections"
        quote: "All sub-contractors (plumbing, electrical, mechanical) must request the inspections for their sub-permits themselves."
        url: https://www.miami.gov/Permits-Construction/Inspections/Schedule-a-Building-Inspection
