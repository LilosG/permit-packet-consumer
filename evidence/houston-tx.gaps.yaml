open_questions:
  - "Open the City of Houston 2026 NEC notice and the City of Houston Electrical Code (Administrative Code Provisions adopted by Ord. No. 2023-9071) on houstonpermittingcenter.org directly in a browser to confirm whether Houston enforces the 2026 NEC as-is or adds local technical amendments, and to quote the exact section governing whether homeowners may pull residential electrical permits."
  - "Open https://www.houstonpermittingcenter.org/hpwcode1056, hpwcode1055, hpwcode1062, hpwcode1053, hpwcode1063, and hpwcode1118 directly in a browser to verify 'Plan Review Required' flags, residential load calculation worksheet requirements, EV charger load factors, and sheet/format requirements."
  - "Open https://www.houstonpermittingcenter.org/hpwcode1119 and the Solar Panel Plan Review User Guide PDF directly in a browser to verify residential solar + battery storage permit requirements, submittal checklist items, sheet requirements, and Houston's implementation of Texas SB 1252 / SB 1202."