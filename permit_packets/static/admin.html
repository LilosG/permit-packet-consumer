<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orders admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/app.css?v={{ASSET_VERSION}}">
</head>
<body>
<header class="site-header"><div class="bar"><a class="brand" href="/">Permit Packets</a><nav class="nav" aria-label="Admin"><a href="/admin">Orders</a></nav></div></header>
<main class="page-main wide">
  <h1>Orders</h1>
  <p class="lead">Newest first. After you see a Wave payment with the order code in its note, unlock the order.</p>
  <p id="msg" class="note" aria-live="polite"></p>
  <div class="table-wrap"><table class="orders">
    <thead><tr><th>Code</th><th>Email</th><th>Address</th><th>Package</th><th>Status</th><th>Created</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
(() => {
  const rows = document.getElementById('rows'), msg = document.getElementById('msg');
  const TIERS = { load_calc: '$39 Load Calc', instant_packet: '$89 Instant', city_checked_24h: '$169 City-Checked' };
  const LABELS = { pending_payment: 'Pending payment', paid: 'Paid', delivered: 'Delivered' };
  const cell = (text) => { const td = document.createElement('td'); td.textContent = text; return td; };

  async function load() {
    const response = await fetch('/api/admin/orders');
    if (!response.ok) { msg.textContent = `Could not load orders (${response.status}).`; return; }
    const { orders } = await response.json();
    msg.textContent = orders.length ? '' : 'No orders yet.';
    rows.replaceChildren(...orders.map((order) => {
      const tr = document.createElement('tr');
      const status = document.createElement('td');
      const pill = document.createElement('span');
      pill.className = `status-pill ${order.status}`; pill.textContent = LABELS[order.status] || order.status;
      status.append(pill);
      const action = document.createElement('td');
      if (order.status === 'pending_payment') {
        const button = document.createElement('button');
        button.textContent = 'Mark Wave Paid & Unlock';
        button.addEventListener('click', async () => {
          button.disabled = true;
          const result = await fetch(`/api/admin/orders/${order.id}/approve`, { method: 'POST' });
          if (!result.ok) { msg.textContent = `Could not approve ${order.order_code} (${result.status}).`; button.disabled = false; return; }
          msg.textContent = `${order.order_code} unlocked.`;
          load();
        });
        action.append(button);
      }
      tr.append(cell(order.order_code), cell(order.customer_email), cell(order.address), cell(TIERS[order.tier] || order.tier), status,
        cell(new Date(order.created_at).toLocaleString()), action);
      return tr;
    }));
  }
  load();
})();
</script>
</body>
</html>
