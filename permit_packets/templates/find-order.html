{% extends "base.html" %}
{% block main %}
<main class="page-main prose">
<h1>Find my order</h1>
<p class="lead">Enter the email you used when you ordered. We'll email you the link to each of your orders.</p>
<form id="find-form" novalidate>
  <label class="field">Email address<input type="email" id="find-email" required maxlength="200" autocomplete="email" placeholder="you@example.com"></label>
  <div class="actions"><button type="submit" id="find-submit">Email me my order links</button></div>
</form>
<p class="note" id="find-result" role="status" aria-live="polite" hidden></p>
<script>
(() => {
  const form = document.getElementById('find-form'), result = document.getElementById('find-result');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const email = document.getElementById('find-email').value.trim();
    if (!email) { document.getElementById('find-email').focus(); return; }
    const button = document.getElementById('find-submit');
    button.disabled = true;
    let message = "If we have orders for that email, we've sent the links.";
    try {
      const response = await fetch('/api/find-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      if (response.ok) message = (await response.json()).message || message;
    } catch (error) { /* the same message is shown whatever happens */ }
    result.textContent = message;
    result.hidden = false;
    button.disabled = false;
  });
})();
</script>

</main>
{% endblock %}
